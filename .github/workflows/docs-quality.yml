name: Docs quality

on:
  pull_request:
    paths:
      - "**/*.md"
      - "scripts/check_docs.py"
      - ".github/workflows/docs-quality.yml"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate documentation
        run: python3 scripts/check_docs.py

